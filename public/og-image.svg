<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0b"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- accent bar -->
  <rect x="80" y="150" width="8" height="330" rx="4" fill="url(#bar)"/>

  <g font-family="Arial, 'Helvetica Neue', sans-serif">
    <text x="120" y="205" font-size="22" letter-spacing="6" fill="#60a5fa">PORTFOLIO</text>

    <text x="118" y="300" font-size="76" font-weight="700" fill="#f5f5f5">SHANN AGANG</text>
    <text x="120" y="360" font-size="40" font-weight="400" fill="#60a5fa">Software Engineer</text>

    <text x="120" y="420" font-size="24" fill="#9ca3af">Building web apps, networks &amp; reliable digital experiences.</text>

    <line x1="120" y1="470" x2="120" y2="470"/>
    <rect x="120" y="468" width="520" height="1" fill="#ffffff" fill-opacity="0.15"/>

    <text x="120" y="520" font-size="20" fill="#6b7280">shannmichaelagang@gmail.com</text>
  </g>

  <!-- corner mark -->
  <g transform="translate(1080,470)">
    <rect x="0" y="0" width="40" height="40" rx="10" fill="#151515" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="20" y="28" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#60a5fa" text-anchor="middle">SA</text>
  </g>
</svg>